   <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>学習空間 歴史マスターテスト</title>
    <style>
        :root { 
            --primary: #f8bbd0; --secondary: #fce4ec; --accent: #ad1457; 
            --bg: #fffcfd; --text: #333; --border-pink: #f48fb1;
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2px; height: 100vh; overflow: hidden; }

        /* --- UI構成 --- */
        .ui-panel { 
            max-width: 1280px; height: 99vh; margin: 0 auto; background: #fff; padding: 8px; 
            border-radius: 15px; box-shadow: 0 4px 15px rgba(173,20,87,0.15); 
            display: grid; 
            grid-template-rows: auto 1fr; /* タイトル行とメイン行 */
            grid-template-columns: 260px 1fr; 
            gap: 8px; border: 2px solid var(--primary);
            box-sizing: border-box;
        }
        .ui-header-main { grid-column: 1 / span 2; text-align: center; font-size: 20px; color: var(--accent); font-weight: bold; padding: 2px 0; }

        /* 左側：操作パネル（縦4段：ご指示の順序） */
        .action-section { 
            grid-row: 2;
            display: flex; flex-direction: column; gap: 8px; 
            justify-content: flex-start; align-items: center; 
            background: #fffafa; border-right: 2px solid var(--secondary); padding: 5px;
        }
        .q-count-box { background: var(--secondary); padding: 10px; border-radius: 12px; width: 100%; text-align: center; color: var(--accent); font-weight: bold; box-sizing: border-box; }
        .q-radio-row { display: flex; justify-content: space-around; margin-top: 5px; }
        
        .side-btn { width: 100%; height: 60px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 12px; border: 2.5px solid var(--accent); background: #fff; color: var(--accent); }
        .make-btn { width: 100%; height: 110px; background: linear-gradient(135deg, #f06292, var(--accent)); color: white; border: none; border-radius: 15px; font-size: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #880e4f; margin-top: 5px; }
        .make-btn:active { transform: translateY(2px); box-shadow: none; }

        /* 右側：時代設定（スクロールなし・全時代を収容） */
        .setting-section { grid-row: 2; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .table-wrapper { flex: 1; border: 1px solid var(--primary); border-radius: 8px; background: white; overflow: hidden; }
        table { width: 100%; height: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; }
        th, td { border: 1px solid var(--border-pink); padding: 0 2px; text-align: center; }
        .cat-cell { background: #fff5f8; font-weight: bold; width: 50px; color: var(--accent); border-right: 1.5px solid var(--border-pink) !important; }
        
        /* ヘッダーの高さを抑えて中身を確保 */
        th.lv-header { background: var(--primary); color: var(--accent); font-size: 12px; height: 65px; vertical-align: middle; }
        .era-name-cell { text-align: left; font-weight: bold; font-size: 11px; width: 180px; color: var(--accent); white-space: nowrap; cursor: pointer; }

        /* レベル別一括ボタン（さらに大型化） */
        .lv-btn { 
            display: block; width: 94%; margin: 4px auto 0 auto; padding: 6px 0; 
            font-size: 12px; font-weight: bold; cursor: pointer; 
            border-radius: 5px; border: 2px solid var(--accent); 
            background: #fff; color: var(--accent); 
        }
        
        /* チェックボックス特大化：30px */
        input.tc { width: 30px; height: 30px; accent-color: var(--accent); }
        input[type="radio"], .era-name-cell input { width: 22px; height: 22px; vertical-align: middle; accent-color: var(--accent); }

        /* --- 印刷用レイアウト --- */
        #out { display: none; flex-direction: column; width: 195mm; height: 278mm; margin: 0 auto; background: white; color: #000; overflow: hidden; font-weight: normal !important; box-sizing: border-box; padding: 5mm; }
        #out * { font-weight: normal !important; color: #000 !important; border-color: #000 !important; }
        .test-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 3px; margin-bottom: 10px; flex-shrink: 0; }
        .header-info { font-size: 10px; flex: 1; margin-left: 15px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        #qs { flex: 1; column-count: 2; column-gap: 25px; column-rule: 0.3px solid #000; align-content: flex-start; }
        .q-row { display: flex; flex-direction: column; border-bottom: 0.5px dotted #999; break-inside: avoid; }
        .q-text { width: 100%; line-height: 1.5; }
        
        .ans-section { margin-top: auto; border-top: 1.5px solid #000; padding-top: 5px; flex-shrink: 0; }
        .ans-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-flow: column; grid-template-rows: repeat(8, auto); gap: 2px 8px; font-size: 9px; line-height: 1.2; }
        .ans-item small { font-size: 7.5px; margin-left: 2px; opacity: 0.8; }

        /* 解答欄の空行を消すための設定 */
        .mode-20 .ans-grid { grid-template-rows: repeat(4, auto); }
        .mode-30 .ans-grid { grid-template-rows: repeat(6, auto); }
        .mode-40 .ans-grid { grid-template-rows: repeat(8, auto); font-size: 8.5px; }

        .mode-20 .q-text, .mode-30 .q-text { font-size: 11.5px; }
        .mode-20 .q-row { margin-bottom: 2.2em; }
        .mode-30 .q-row { margin-bottom: 0.5em; } 
        .mode-40 .q-text { font-size: 8.3px; line-height: 1.4; }
        .mode-40 .q-row { margin-bottom: 0.5em; } 

        @media print { .no-print { display: none; } body { background: white; overflow: visible; padding: 0; } #out { display: flex !important; } @page { size: A4; margin: 0; } }
    </style>
</head>
<body>

<div class="no-print ui-panel">

</div>

        <div class="header-info" id="print-range">範囲：</div>
        <div style="font-size:14px; white-space:nowrap; margin-right:15px;">　　　点 ／ <span id="q-total-disp"></span>問</div>
        <div style="font-size:12px; white-space:nowrap;">氏名：__________________________</div>

</div>

<script>
// --- 時代定義 ---
const eraNames = { 1:"⑬世界の文明", 2:"⑬縄文時代", 3:"⑬弥生時代", 4:"⑭飛鳥時代", 5:"⑭奈良時代", 6:"⑭平安時代（前）", 7:"⑭平安時代（後）", 8:"⑲鎌倉時代", 9:"⑳南北朝時代", 10:"⑮室町時代", 11:"⑯戦国時代", 12:"⑯安土桃山時代", 13:"⑰江戸時代（前期）", 14:"⑰江戸時代（中期）", 15:"⑱江戸時代（後期）", 16:"⑲明治時代（前期）", 17:"⑲明治時代（後期）", 18:"㉑大正時代", 19:"㉑昭和（第２戦まえ）", 20:"㉑昭和（第２戦あと）", 21:"㉒平成" };
const eraShortNames = { 1:"世界", 2:"縄文", 3:"弥生", 4:"飛鳥", 5:"奈良", 6:"平安", 7:"平安", 8:"鎌倉", 9:"南北朝", 10:"室町", 11:"戦国", 12:"桃山", 13:"江戸", 14:"江戸", 15:"江戸", 16:"明治", 17:"明治", 18:"大正", 19:"戦前", 20:"戦後", 21:"平成" };
const categoryMap = { "古代": [1,2,3,4,5,6,7], "中世": [8,9,10,11,12], "近世": [13,14,15], "近代": [16,17,18], "現代": [19,20,21] };

// --- データベース：全483問 原文を正確に復元 (ID 1-21) ---
const rawData = {
    1: [{v:0,q:"約20万年前に出現した人類。\n現在の人類の直接の祖先。",a:"新人"},{v:0,q:"狩りや採集で移動生活をした時代。\n打製石器を使用した。",a:"旧石器時代"},{v:0,q:"農耕や牧畜で定住生活をした時代。\n磨製石器を使用した。",a:"新石器時代"},{v:1,q:"石を打ち欠いて作った道具。槍などに使用された。旧石器ともいわれる。",a:"打製石器"},{v:0,q:"石の表面を磨いた石器。打製石器より刃が鋭くなった。新石器ともいわれる。",a:"磨製石器"},{v:1,q:"チグリス川とユーフラテス川流域でおこった文明。\n紀元前3000年頃からおこった。",a:"メソポタミア文明"},{v:2,q:"メソポタミア文明で用いられたねんど板や石に刻まれた文字。ハンムラビ法典もこの文字で書かれていた。",a:"くさび形文字"},{v:0,q:"エジプトのナイル川流域でおこった文明。\n紀元前3000年頃におこり、高い測量技術をもっていた。",a:"エジプト文明"},{v:0,q:"エジプト文明で絵文字から発展した文字。\nエジプトのピラミッドの内部などに描かれている。",a:"象形文字"},{v:0,q:"エジプト文明で使われた、太陽の動きを基にした暦。1年を365日とした。現在、日本を含め世界で使用。",a:"太陽暦"},{v:0,q:"紀元前2500年頃、インドのインダス川流域でおこった文明。",a:"インダス文明"},{v:0,q:"バラモン(神官)を最高の身分とする身分制度。\nインダス文明で使用された。",a:"カースト制度"},{v:0,q:"紀元前5世紀頃、仏教を説いた人物。",a:"シャカ"},{v:0,q:"紀元前2000年頃、中国の黄河と長江流域でおこった文明。",a:"中国文明"},{v:0,q:"中国最古の王朝。\n紀元前1500年頃に繁栄した。",a:"殷（漢字かけなくてOK）"},{v:0,q:"亀の甲羅や牛の骨に刻まれた文字。\n漢字のもとになった。",a:"甲骨文字"},{v:1,q:"紀元前6世紀頃、儒教(儒学)を説いた人物。\n道徳心の大切さを説いた。",a:"孔子"},{v:1,q:"紀元前6世紀頃に孔子が解いた教えは？",a:"儒教（儒学）"},{v:0,q:"紀元前221年、中国を統一した王朝。\n統一後わずか15年で滅亡した。",a:"秦"},{v:0,q:"紀元前221年、中国を統一した秦王朝の皇帝。\n急激な改革を行い、反感をかった。",a:"始皇帝"},{v:0,q:"遊牧民の侵入を防ぐため、秦の始皇帝が築いた城壁。\n全長2,000km以上。",a:"万里の長城"},{v:0,q:"中国とヨーロッパの交流に使われた道。\n絹などが運ばれた。",a:"シルクロード"}],
    2: [{v:0,q:"狩猟や採集で移動生活をした時代。\nたて穴住居、貝塚、土偶などを使用した。",a:"縄文 時代"},{v:2,q:"厚くもろい縄目模様（なわめもよう）の土器。\n食料の保存や煮炊きに使用された。",a:"縄文 土器"},{v:1,q:"地面を掘って柱を立て、そのの上に屋根をかけた住居。",a:"たて穴住居"},{v:0,q:"古代の人類のごみ捨て場。\n捨てられた貝や魚の骨が積み重なったもの。",a:"貝塚"},{v:1,q:"縄文時代に、土で作られた人形。\n占いや魔よけに使用された。",a:"土偶"},{v:0,q:"青森県にある縄文時代の遺跡。\n大規模な集落の跡がある。",a:"三内丸山遺跡"}],
    3: [{v:3,q:"農耕や牧畜で定住生活をした時代。朝鮮半島から九州に稲作が伝わった。卑弥呼が活躍し、魏（今の中国）と交流。",a:"弥生時代"},{v:0,q:"縄文土器より薄くて硬い土器。\n飾りが少なく実用的。",a:"弥生土器"},{v:1,q:"稲作が日本に伝わったのはいつごろ？",a:"縄文時代の終わり"},{v:0,q:"刃物状の磨製石器。\n稲の穂を刈るのに使用された。",a:"石包丁"},{v:1,q:"稲を保存するための建物。\nネズミなどが侵入出来ないよう、床を高くした。",a:"高床倉庫"},{v:2,q:"佐賀県にある弥生時代の遺跡。\n堀のある集落や物見やぐらの跡がある。",a:"吉野ヶ里遺跡"},{v:2,q:"九州の小さなくに。57年、中国の漢に使いを送り、金印を授かった。",a:"奴国"},{v:1,q:"奴国の王が、漢から授かったもの。「漢倭奴国王」と記されている。",a:"金印"},{v:3,q:"秦の滅亡後、中国を統一した国。奴国の王に金印を送った。",a:"漢"},{v:3,q:"約30の小国を従えたくに。\n所在地は、九州という説と近畿という説がある。",a:"邪馬台国"},{v:6,q:"邪馬台国の女王。239年、中国の魏!!から「親魏倭王」の称号を授かった。",a:"★卑弥呼"},{v:3,q:"魏の歴史書。3世紀の日本や邪馬台国に関する記述が残っている。",a:"魏志倭人伝"}],
    4: [{v:2,q:"推古天皇の時、蘇我氏の協力で天皇の補佐役である摂政!!になった人物。仏教を重んじて政治を行った。",a:"★聖徳太子"},{v:2,q:"家柄に関係なく、能力に応じて役人を選ぶ制度。\n603年に聖徳太子よって制定された。",a:"冠位十二階"},{v:4,q:"役人の心構えを示したもの。天皇を中心に、仏教の教え!を重んじる内容。604年に聖徳太子よって制定された。",a:"十七条の憲法"},{v:1,q:"隋（中国）の制度や文化を取り入れるため派遣された使節団。607年に聖徳太子よって派遣された。小野妹子が有名",a:"遣隋使"},{v:1,q:"西方の影響を受けた日本最初の仏教文化。\n法隆寺が代表的。",a:"飛鳥文化"},{v:2,q:"聖徳太子が建立した寺。\n現存する世界最古の木造建築物。",a:"法隆寺"},{v:4,q:"645年、中大兄皇子(後の天智天皇)と中臣鎌足(後の藤原鎌足)が蘇我氏を倒して行った政治改革。",a:"大化の改新"},{v:4,q:"645年、大化の改新を行ったのは、中臣鎌足(後の藤原鎌足)と❶誰か。また、その人物はのちに❷何天皇になったか。",a:"★中大兄皇子(天智天皇)"},{v:2,q:"天智天皇が土地や人民を国家のものとした制度。\nはじめての全国の戸籍もつくられた。",a:"公地公民"},{v:2,q:"地方を治めるために、➀中央から派遣された役人は？　➁その部下として地方の豪族から選ばれた役人は？",a:"➀国司　➁郡司"},{v:6,q:"663年、日本が朝鮮半島に兵を出して敗れた戦い。\n唐や新羅に攻められていた百済を救うために出兵した。",a:"白村江の戦い"},{v:2,q:"676年、唐と同盟を組み、百済や高句麗を滅ぼし、朝鮮半島を統一した国。",a:"新羅"},{v:5,q:"北九州の防衛にあたる職務で、農民が兵役を負担した。",a:"防人"},{v:2,q:"天智天皇の死後、弟の大海人皇子(後の天武天皇)と子の大友皇子が天皇の地位を争った出来事。",a:"壬申の乱"},{v:2,q:"701年に、唐の法律を手本に日本で作られた法律は？",a:"大宝律令"},{v:2,q:"律（りつ）と令（りょう）という２つの法律よっておさめられる国を何というか。日本がそうなったのは何時代か。",a:"律令国家（飛鳥時代）"},{v:4,q:"6歳以上の全ての人に口分田を与えて税を徴収する制度.口分田は持ち主が死んだあとは国に返された。",a:"班田収授法"},{v:8,q:"律令がととのった奈良時代に、班田収授法により6歳以上の全ての人に与えられたもの。",a:"口分田"},{v:3,q:"税の種類で、収穫した稲の3%を納めること。",a:"租"},{v:1,q:"税の種類で、上京して労役に服すること。\n通常は、代わりに布など納めた。",a:"庸"},{v:6,q:"税の種類で、特産物を納めること。\n絹、糸、綿などが納められた。",a:"調"},{v:1,q:"隋の滅亡後、律令という中央集権政治を行った➀中国のそのころの国名と②その首都は？",a:"➀唐　②長安"},{v:1,q:"630年～894年に唐に16回派遣された使節団。\n唐の文化や中央集権政治を取り入れるために派遣された",a:"遣唐使"},{v:0,q:"708年に発行され実際に使われた、金属の貨幣。\n真ん中に穴が開いている。",a:"和同開珎"}],
    5: [{v:3,q:"唐の都の長安にならい、奈良につくられた都。ここで奈良時代が始まった。シルクロードの終着点とされた。",a:"平城京"},{v:1,q:"平城京がつくられた年号。\n覚え方･･･[なんと]大きな平城京。",a:"710年"},{v:4,q:"新しく開墾した土地の永久私有を認めた法律。\n足りなくなった口分田をふやすためにつくられた。",a:"墾田永年私財法"},{v:5,q:"東大寺と、国ごとに国分寺と国分尼寺を建立した天皇。\n仏教の力で国を治めようとした。",a:"★聖武天皇"},{v:3,q:"聖武天皇が都(奈良)に建立した寺。僧の行基が協力し、大仏が造られた。仏教の力で国を治めようとした。",a:"東大寺"},{v:0,q:"東大寺の中にある校倉造の建物。\n遣唐使が持ってきた、聖武天皇の愛用品が収められた。",a:"正倉院"},{v:1,q:"何度も遭難し、失明しながらも来日した唐の僧侶。\n唐招提寺を建立した。",a:"鑑真"},{v:2,q:"奈良時代の国際色豊かな文化。唐の影響を強く受けた。\n東大寺の中にある正倉院が代表的。",a:"天平文化"},{v:0,q:"日本神話や歴史が記された日本最古の歴史書。",a:"古事記"},{v:1,q:"720年に完成した、現存する日本最古の歴史書。\n呪術廻戦の宿儺(すくな)も登場する。",a:"日本書紀"},{v:2,q:"日本各地の伝説や名産品などの情報を、国ごとにまとめた地理書。",a:"風土記"},{v:4,q:"日本最古の歌集。農民や防人など身分が低いものから、身分が高いものまで収められている。柿本人麻呂、山上憶良らなど。",a:"万葉集"}],
    6: [{v:3,q:"794年、都を平安京(京都)に移した天皇。\n律令制を強化するため。",a:"★桓武天皇"},{v:0,q:"東北の蝦夷（えみし）の討伐軍の最高司令官。\n天皇によって任命された。",a:"征夷大将軍"},{v:1,q:"桓武天皇から征夷大将軍に任命された人物。\n日本の北方の蝦夷の平定にあたった。",a:"坂上田村麻呂"},{v:5,q:"唐から帰国した最澄が広めた仏教の宗派。\n滋賀県の比叡山に延暦寺!を建てて広めた。",a:"天台宗"},{v:4,q:"唐から帰国した空海が広めた仏教の宗派。\n和歌山県の高野山に金剛峰寺!を建てて広めた。",a:"真言宗"},{v:6,q:"平安時代の仏教の２つの宗派の語呂合わせは？\nてんさいしんくう（天台宗が最澄、真言宗が空海）",a:"てんさいしんくう"},{v:2,q:"935年に関東で、朝廷に反乱した豪族。\n新皇を名のったが、すぐに武士の力で鎮圧された。",a:"平将門"},{v:0,q:"939年に瀬戸内海で、朝廷に反乱し、武士の力で鎮圧された人物。元は貴族だったが、海賊のボスになった。",a:"藤原純友"},{v:1,q:"藤原鎌足（中臣鎌足）の子孫の一族。\n摂関政治で天皇家との結びつきを強めた。",a:"★藤原氏"},{v:5,q:"自分の娘を天皇のきさきにし、その子供を天皇にして,実権を握る政治 !!!。天皇が幼い時は摂政、成人してからは関白となる。",a:"摂関政治"},{v:2,q:"1016年に摂政となり、摂関政治で大きな権力を握った人物。",a:"藤原 道長"},{v:4,q:"藤原道長の子で、摂関政治で大きな権力を握った。\n美しい寝殿造の平等院鳳凰堂!!!という建物を建てた。",a:"藤原 頼通"},{v:4,q:"藤原道長の子で、摂関政治で大きな権力を握った藤原頼通が京都の宇治に建てた美しい寝殿造の建物。",a:"平等院鳳凰堂"},{v:4,q:"唐が衰退してきたことを理由に、遣唐使を停止した人物。",a:"菅原道真"},{v:4,q:"平安時代の日本独自の文化.寝殿造の建物が有名。\n菅原道真の提案で遣唐使が停止された後に栄えた。",a:"国風文化"},{v:1,q:"平安時代の国風文化の中で生まれた文字。女性が多く用いたことで、豊かな文学作品が多く書かれた。",a:"かな文字"},{v:1,q:"平安時代に、天皇の命令で紀貫之が編集した和歌集。",a:"古今和歌集"},{v:4,q:"「源氏物語!!」をかな文字で執筆した女流作家。\n京都を舞台にした物語を書いた。",a:"紫式部"},{v:2,q:"平安時代に「枕草子」という随筆を執筆した女性の作家。（随筆とは、身の回りことについて考えた日記のようなもの）",a:"清少納言"}],
    7: [{v:0,q:"来世の幸福（死んだ後に極楽に行ける）を信じるという教え。平安時代の終わりに民衆に広まった。",a:"浄土信仰"},{v:3,q:"浄土信仰に基づいて建てられた、東北地方の建物はなにか？　場所も答えなさい。",a:"中尊寺金色堂 岩手県平泉"},{v:2,q:"岩手県平泉に中尊寺金色堂を建てたのは何氏？",a:"奥州藤原氏"},{v:0,q:"新羅を倒して、朝鮮半島を統一した国。\n高句麗と似ているので注意。",a:"高麗"},{v:1,q:"唐の滅亡後、分裂状態だった中国を統一した国。　平清盛と貿易を行った。火薬、羅針盤、活版印刷などが発達。",a:"宋"},{v:3,q:"貴族や寺社の私有地。\n国司の圧力から逃れるため、貴族や寺院に寄進された。",a:"荘園"},{v:0,q:"天皇の位を子や孫にゆずり、陰で政治の実権を握る立場。",a:"上皇"},{v:1,q:"1086年、天皇の位を8才の子にゆずり上皇になった人物。\n後に、出家して法皇になった。院政を初めて行った。",a:"白河上皇"},{v:2,q:"天皇が退位し上皇となり、院とよばれる御所で、自分の思い通りに行った政治。白河上皇が最初。",a:"院政"},{v:0,q:"日本の東国に勢力を広げた大武士団。\n摂政や関白と結びつき、勢力を広げた。",a:"源氏"},{v:0,q:"日本の西国に勢力を広げた大武士団。\n上皇と結びつき、院の警備などにあたった。",a:"平氏"},{v:2,q:"平氏が権力を握るきっかけとなった２つの乱。",a:"保元の乱・平治の乱"},{v:6,q:"保元の乱で、後白河天皇の勝利に貢献した平氏の棟梁。\n武士で初めて太政大臣になった。厳島神社を建てた。",a:"★平清盛"},{v:6,q:"平清盛は武士で初めて何になった？",a:"太政大臣"},{v:6,q:"日本と宋との貿易。平清盛が兵庫県の港を中心に行った。\n日本は硫黄・金を輸出し、絹・宋銭を輸入した。",a:"日宋貿易"},{v:1,q:"ローマ教皇を頂点として繁栄したキリスト教の宗派（グループ）。ローマ教皇は国王より強い力を持った。",a:"カトリック"},{v:0,q:"キリスト教の聖地。\nイスラム教徒に占領されたため、十字軍を送った。",a:"エルサレム"},{v:1,q:"ヨーロッパの王や貴族がつくった遠征軍。\nローマ教皇はエルサレムを取り戻すため、出兵した。",a:"十字軍"}],
    8: [{v:2,q:"源義朝の息子。\n鎌倉（神奈川県）を拠点に統治体制を整えた。",a:"★源頼朝"},{v:0,q:"1185年、源氏が平氏を滅ぼした戦い。",a:"壇ノ浦の戦い"},{v:6,q:"国を警備したり、軍事を担当する役職。犯罪者の取り締まりなど警察の役割。1185年、源義経を捕らえる目的で設置。",a:"守護"},{v:3,q:"土地を管理する役職。年貢の取り立てなどをした。\n1185年、源頼朝によって設置された。",a:"地頭"},{v:0,q:"源頼朝が開いた幕府。\n1192年に、源頼朝は征夷大将軍になった。",a:"鎌倉幕府"},{v:2,q:"征夷大将軍に仕えた武士をなんというか。\nその中から、守護や地頭に任命された。",a:"御家人"},{v:4,q:"将軍は御家人に領地(土地)を与え、保護し、御家人は将軍に忠誠を誓い、幕府のための戦うという封建社会の主従関係。",a:"御恩と奉公"},{v:4,q:"➀御恩 と ➁奉公 をそれぞれ説明しなさい。",a:"➀領地を与えたり、保護すること。　➁幕府のために戦うこと。"},{v:1,q:"鎌倉時代の武士の一族で、惣領（ボス）が亡くなったあとの相続の方法は何ですか？",a:"分割相続"},{v:1,q:"鎌倉時代の武士の一族で、惣領が亡くなったあとの分割相続の問題点は何ですか？",a:"領地をすべての子供に分けるため、どんどん小さくなってしまう"},{v:5,q:"鎌倉時代の将軍の補佐役は？",a:"執権"},{v:2,q:"源頼朝の妻の北条政子の家系の一族。\n他の有力武士を倒し、執権となって実権を握った。",a:"★北条氏"},{v:2,q:"将軍の補佐役が実権を握る政治.北条氏が確立した。",a:"執権政治"},{v:7,q:"後鳥羽上皇の朝廷側が幕府を倒そうと挙兵した出来事。北条政子が御家人の心を動かし、後鳥羽上皇を退けた。",a:"承久の乱"},{v:2,q:"承久の乱を起こした、朝廷側の中心人物はだれか.この人物は新古今和歌集も作成させた。",a:"後鳥羽上皇"},{v:2,q:"後鳥羽上皇が起こした承久の乱をしずめた、鎌倉幕府の女性は？",a:"北条政子"},{v:5,q:"朝廷を監視するため、京都に置かれた役所。承久の乱の直後に設置された。",a:"六波羅探題"},{v:6,q:"御家人の権利や義務、裁判の基準をさだめた法律。1232年、3代執権の北条泰時が制定した",a:"御成敗式目"},{v:2,q:"鎌倉時代に制定された御成敗式目は、\n❶誰のために❷誰によって制定された？",a:"❶御家人❷北条泰時"},{v:3,q:"武士を中心とした素朴で力強い文化。東大寺南大門!!にある運慶作の金剛力士像!!が代表的。",a:"鎌倉文化"},{v:1,q:"鎌倉時代の和歌集。後鳥羽上皇の命令により藤原定家などの歌が収録された。",a:"新古今和歌集"},{v:2,q:"鎌倉時代に、琵琶法師によって語り継がれた軍記物。平清盛が主人公。",a:"平家物語"},{v:2,q:"法然が説いた教え。「南無阿弥陀仏」の念仏を唱えた。",a:"浄土宗 (法然)"},{v:0,q:"親鸞が説いた教え。悪人も救われると説いた。",a:"浄土真宗 (親鸞)"},{v:2,q:"日蓮が説いた教え。「南無妙法蓮華経」の題目を唱えた。",a:"日蓮宗 (日蓮)"},{v:3,q:"栄西が説いた禅宗の教え。武士に広まった。",a:"臨済宗 (栄西)"},{v:3,q:"道元が説いた禅宗の教え。武士に広まった。ひらすら座禅を組むことをすすめた。",a:"曹洞宗 (道元)"},{v:3,q:"一遍が説いた教え.踊念仏という念仏をおこなった。",a:"時宗 (一遍)"},{v:3,q:"先生にきいて！ 鎌倉時代の仏教の宗派のうち、覚えにくい３つの❶語呂合わせは？ ❷それぞれ誰の何宗？",a:"一時にエリの同窓会（一遍時宗 栄西臨済 道元曹洞）"},{v:3,q:"上の６つの鎌倉時代の仏教は民衆の間に広く広まったが、その理由はなにか？",a:"以前の仏教より、教えが簡単で、実行しやすかったから。"},{v:5,q:"栄西の臨済宗と、道元の曹洞宗は座禅による修行で悟りを開くという教え!!であるから、２つをまとめて何とよぶ？",a:"禅宗"},{v:0,q:"中央アジアを征服し、モンゴル帝国を築いた人物。政治や軍事を整えて力をつけた。",a:"チンギス・ハン"},{v:0,q:"チンギス・ハンの孫のフビライ・ハンが建国した国。高麗を従え、宋を滅ぼし、アイヌ民族を降伏させた。",a:"元"},{v:2,q:"北条時宗が執権の時の、元による二度の襲来。集団戦法と火薬を武器で日本を攻めた。文永の役と弘安の役の２回。",a:"元寇"},{v:1,q:"元による二度の襲来があったときの執権。",a:"北条時宗"},{v:7,q:"御家人の借金を帳消しするために出された法令。領地の質入れも禁じた。借金は「ヲイメ(負い目)」ともよばれた。!!!!",a:"徳政令"},{v:10,q:"御家人の借金を帳消しするために出された徳政令において、借金は何とよばれたか。3種類の書き方で答えなさい。",a:"ヲヰメ/ヲイメ/負い目"},{v:2,q:"鎌倉時代に寺社の門前や交通の要地で開かれるようになり、商品が取引されていた場所とは。",a:"定期市"}],
    9: [{v:2,q:"1333年、鎌倉幕府を滅ぼした天皇.御家人の足利尊氏らと挙兵した.建武の新政を行った。",a:"★後醍醐天皇"},{v:2,q:"後醍醐天皇によって行われた天皇中心の政治.武士の反感をかった。",a:"建武の新政"},{v:2,q:"後醍醐天皇とともに鎌倉幕府を滅ぼしたが、のちに後醍醐天皇を追放して、京都に朝廷を作った人物。",a:"★足利尊氏"},{v:0,q:"足利尊氏が京都につくった朝廷。",a:"北朝"},{v:0,q:"逃れた後醍醐天皇が奈良県の吉野につくった朝廷。",a:"南朝"}],
    10: [{v:1,q:"1338年、足利尊氏が京都に開いた幕府。北朝の天皇によって任命されて開いた。",a:"室町幕府"},{v:5,q:"室町時代の将軍の補佐役は？",a:"管領"},{v:0,q:"守護が赴任先で武士を従えて大名になったもの。地方で力を伸ばした。",a:"守護大名"},{v:3,q:"★足利義満。室町幕府の3代将軍。南朝と北朝を統一した。日明貿易（勘合貿易）を行った。金閣寺も建てた。",a:"★足利義満"},{v:0,q:"漢民族が中国に建国した國。\nモンゴル民族を追い出した。",a:"明"},{v:2,q:"現在の沖縄に、尚氏を中心に建国された國。日本、明、東南アジアを結ぶ中継貿易で繁栄した。",a:"琉球王国"},{v:5,q:"琉球王国が行っていた貿易。日本、明、東南アジアを結び、大きな利益を得た。",a:"中継貿易"},{v:2,q:"琉球王国が行っていた貿易についてくわしく答えよ。",a:"琉球王国は、各国を結ぶ中継貿易で、大きな利益を得た。"},{v:1,q:"北九州などの武士や漁民が海賊になったもの。中国周辺で略奪をした。足利義満が取り締まって勘合貿易を行った。",a:"倭寇"},{v:6,q:"勘合貿易 (日明貿易)。倭寇と区別するため、正式な貿易船に合札を持たせた貿易。足利義満が明との間で行った。",a:"勘合貿易"},{v:4,q:"勘合。倭寇（海賊）と区別するため、正式な貿易船が証明として持っていた合い札の名前は？",a:"勘合"}],
    11: [{v:1,q:"ルネサンス.教会の考え方にしばられない自由な文化。ヨーロッパで古代ギリシャ・ローマ文明が見直された。イタリアがはじめ。",a:"ルネサンス"},{v:3,q:"大航海時代.15世紀から17世紀にかけてヨーロッパ人によるアジアやアメリカへの航海が盛んに行われた時代は？",a:"大航海時代"},{v:2,q:"コロンブス.1492年、アメリカ大陸近くの島に到達した人物。スペインの援助を受けた。",a:"コロンブス"},{v:1,q:"コロンブス到達年号。覚え方･･ 「意欲に（いよくに）燃えるコロンブス。」",a:"1492年"},{v:1,q:"1498年、アフリカ大陸南の喜望峰をまわってインドに到達したポルトガル人。",a:"バスコ・ダ・ガマ"},{v:0,q:"マゼラン.世界一周の航路を発見したスペインの艦隊の航海者。世界一周達成前に戦死し、残された艦隊が達成した。",a:"マゼラン"},{v:2,q:"宗教改革.ドイツのルターが行った運動。カトリックに反対してプロテスタントをつくった。",a:"宗教改革"},{v:2,q:"ルター（ドイツ）。宗教改革の中心人物はだれ・どこの国か。カトリックに反対するプロテスタントの基礎を作った。",a:"ルター（ドイツ）"},{v:2,q:"イエズス会.世界各国に宣教師を送ったカトリックの会.プロテスタントの宗教改革に対抗して結成された。",a:"イエズス会"},{v:2,q:"ポルトガル人.鉄砲を伝えたのは何人。1543年、鉄砲は種子島に伝わった。",a:"ポルトガル人"},{v:2,q:"南蛮貿易.スペインやポルトガルとの貿易。鉄砲、火薬、毛織物などを輸入し活版印刷が伝わった。日本は銀や金を輸出した。",a:"南蛮貿易"},{v:2,q:"フランシスコ・ザビエル。キリスト教を伝えたイエズス会（カトリック）の宣教師。1549年、鹿児島に上陸した。",a:"フランシスコ・ザビエル"},{v:2,q:"並び替えなさい ➀イエズス会の宣教師が日本へ ②カトリックに反対し、ルターが宗教改革を始め、プロテスタントをつくる ③キリスト教のカトリックが金もうけを行った ④カトリックで内部改革が起き、イエズス会が結成。",a:"③②④➀"},{v:2,q:"戦国時代.応仁の乱により、戦乱が広がった時代。この時代の有力な大名を何というか。",a:"戦国大名"},{v:0,q:"城下町.戦国大名の城のまわりにつくられた町。各地の政治、経済、文化の中心となった。",a:"城下町"},{v:7,q:"分国法.戦国大名が自分の領地を支配するための法律。武田氏・朝倉氏などが定めたものが有名。",a:"分国法"},{v:4,q:"テストに出やすいが間違いやすい、 鎌倉時代・戦国時代・江戸時代の３つのきまり名と対象を答えなさい。",a:"➀鎌倉-御成敗式目(御家人のため) ②戦国-分国法(戦国大名) ③江戸-武家諸法度(大名のため)"}],
    12: [{v:5,q:"★織田信長.尾張(愛知県)出身の戦国大名.安土城を建てたり、楽市楽座を行った。",a:"★織田信長"},{v:0,q:"長篠の戦い.信長と家康の連合軍が、武田勝頼を倒した、鉄砲活用の戦い。",a:"長篠の戦い"},{v:1,q:"一向一揆.石山本願寺を中心とする一向宗が信長の天下統一に抵抗した一揆。",a:"一向一揆"},{v:6,q:"座の廃止や市場での税の免除などの政策。商工業を発展させるため、織田信長によって行われた。",a:"楽市・楽座"},{v:1,q:"本能寺の変.織田信長が、家臣の明智光秀に裏切られ自害した事件。織田信長が自害した。",a:"本能寺の変"},{v:1,q:"★豊臣秀吉.明智光秀を倒し、朝廷から関白に任命された人物。1590年、全国を統一した。",a:"★豊臣秀吉"},{v:2,q:"太閤検地。豊臣秀吉による、田畑の持ち主や、広さ調べ、米の生産高を石高（こくだか）!!であらわした政策。",a:"太閤検地"},{v:1,q:"太閤検地。実際に田や畑の責任者として登録されたのはだれか。",a:"耕作者"},{v:2,q:"刀狩。一揆を防ぐため、農民(百姓)から武器を取り上げる政策。豊臣秀吉による。",a:"刀狩"},{v:6,q:"兵農分離.豊臣秀吉による、太閤検地や刀狩で、武士と農民(百姓)の区別を明確にする政策!!!。",a:"兵農分離"},{v:1,q:"桃山文化.成長した大大名や大商人による豪華で壮大な文化。城には天守閣などがつくられた。",a:"桃山文化"},{v:0,q:"安土城。織田信長が滋賀県に建てた城。",a:"安土城"},{v:0,q:"大阪城。豊臣秀吉が建てた城.華やかな屏風絵が飾られた。",a:"大阪城"},{v:4,q:"狩野永徳.「唐獅子図屏風（からじしずびょうぶ）」を描いた絵師。",a:"狩野永徳"},{v:7,q:"千利休。わび茶から茶道を完成させた、秀吉に仕えた茶人。",a:"千利休"},{v:1,q:"出雲の阿国。かぶき踊りを始めた女性.後に歌舞伎となった。",a:"出雲の阿国"},{v:3,q:"下剋上。実力のある下の身分の者が、上の身分の者を倒すこと.当時の風潮。",a:"下剋上"}],
    13: [{v:3,q:"長篠の戦いで織田信長と同盟した三河(愛知県)の大名。\nのちに江戸幕府を開いた。",a:"★徳川家康"},{v:1,q:"1600年に起こった、徳川家康と石田三成の戦い。\n徳川家康が勝利し、征夷大将軍になり、江戸幕府を開いた。",a:"関ヶ原の戦い"},{v:1,q:"幕府と藩が全国の土地と人民を支配する方式。\n幕府は藩を統制した。",a:"幕藩体制"},{v:2,q:"江戸幕府の将軍直属で、国政の中心となる役職。\n政治一般を担当する最高職。",a:"老中"},{v:2,q:"江戸幕府の役職で、非常時などに特別に、必要に応じておかれたものは？　老中よりも地位が上になる。",a:"大老"},{v:0,q:"徳川家の親戚（一族）の大名。\n特に、尾張、紀伊、水戸は御三家として重んじられた。",a:"親藩"},{v:1,q:"関が原の戦い以前から徳川家の家臣だった大名。\n幕府の要職につくことができた。",a:"譜代大名"},{v:0,q:"関が原の戦い以降に徳川家の家臣になった大名。\n幕府の要職につくことができなかった。",a:"外様大名"},{v:2,q:"江戸幕府は大名を全国にどのように配置したか。",a:"江戸など重要な地域周辺には親藩や譜代大名を、遠くに外様大名を配置した。"},{v:0,q:"徳川家康が、反発する豊臣氏を滅ぼした戦い。\n1614年の冬と1615年の夏の二回。",a:"大坂の陣"},{v:4,q:"大名を統制するための法律。\n城の改築や婚姻に、幕府の許可が必要になった。",a:"武家諸法度"},{v:6,q:"大名に領土と江戸を往復させる制度。\n3代軍徳川家光によって制度化された。",a:"参勤交代"},{v:4,q:"参勤交代を武家諸法度に追加した、３代将軍はだれ？",a:"徳川家光"},{v:0,q:"日本橋を起点とした大きな道。\n参勤交代で人の往来が盛んになり、整備された。",a:"五街道"},{v:0,q:"農村での連帯責任制度。\n土地を持つ本百姓と土地をもたない水呑百姓がいた。",a:"五人組"},{v:2,q:"江戸時代，大阪で、諸藩が年貢米や特産物などを保管・販売した倉庫を何というか。",a:"蔵屋敷"},{v:4,q:"テストに出やすいが間違いやすい、\n鎌倉時代・戦国時代・江戸時代の３つのきまりについて、きまりの名前と、対象は誰か、それぞれ答えなさい。",a:"➀鎌倉-御成敗式目(御家人のため)　②戦国-分国法(戦国大名)　③江戸-武家諸法度(大名のため)"},{v:5,q:"徳川幕府に朱印状を与えられた船による江戸時代の貿易。\n東南アジアと盛んに交易し、各地に日本町ができた。",a:"朱印船貿易"},{v:1,q:"重い年貢やキリスト教徒弾圧に反発して熊本県で起こった一揆。その後、ポルトガル船が禁止され、鎖国が完成。",a:"島原・天草一揆"},{v:0,q:"隠れキリシタンを見つけるために踏ませた絵。\nキリストやマリアの絵を踏むかどうかで見分けた。",a:"踏絵"},{v:3,q:"幕府がオランダ商館を移した場所の名前と県名は？",a:"出島（長崎県）"},{v:6,q:"➀外国との貿易を禁止する体制。キリスト教を禁止すること(禁教)などを目的とした。➁許可された主な２つの国は？",a:"➀鎖国\n➁オランダ・中国"},{v:1,q:"幕府がオランダに提出させた海外の様子についての報告書。",a:"風説書（オランダ風説書）"},{v:1,q:"間違いやすい!\n貿易がOKな国、禁止になった国で間違いやすいのは？",a:"OK⇒ 中国オランダ朝鮮\nダメ⇒ ポルトガル"},{v:0,q:"身分重視の朱子学を幕府の学問とした5代将軍。\n極端な動物保護政策のなどで人々を苦しめた。",a:"徳川綱吉"},{v:0,q:"江戸時代に繁栄した江戸、大阪、京都の総称。江戸は政治の中心地、大阪は商業の中心地、京都は文化の中心地。",a:"三都"},{v:5,q:"上方(京都・大阪)中心の町人による新しい文化。\nこの文化のころの将軍は徳川綱吉だった。",a:"元禄文化（京都大阪）"},{v:0,q:"浮世草子の人気作家。\n「日本永代蔵」で町人の成功や失敗を描いた。",a:"井原西鶴"},{v:0,q:"浮世絵を始めた画家。\n「見返り美人図」などを描いた。",a:"菱川師宣"},{v:3,q:"俳諧（俳句のこと）で、わび・さびを表現した俳人。　東北地方を旅行した時に書いた紀行文の「奥の細道」が有名。",a:"松尾芭蕉"},{v:2,q:"人形浄瑠璃の脚本家。\n「曽根崎心中」で義理と情に悩む人の姿を描いた。",a:"近松門左衛門"},{v:0,q:"1644年、中国を統一した国。その後、1912年まで300年近く中国を支配した。（最後は辛亥革命によりほろびた。）",a:"清"},{v:2,q:"江戸時代には、肥料の使用や、農具の発明などが行われたが、田畑を深く耕すのを可能にした農具は何か。",a:"備中ぐわ"},{v:2,q:"江戸時代に農業が発展し、自分が食べるのではなく、売って現金を得ることを目的として栽培した作物を何というか。",a:"商品作物"},{v:4,q:"江戸時代に最も栄え、世界遺産にも登録された、島根県にある日本最大の銀がとれる場所は？",a:"石見銀山"},{v:1,q:"江戸時代に、キリスト教徒ではないことを証明するため、だれがどのお寺に所属しているかを記録したもの。",a:"宗門人別改帳"}],
    14: [{v:4,q:"江戸の町人文化。有名なのは、葛飾北斎!!・安藤広重・十返舎一九らが活躍。",a:"化政文化（江戸）"},{v:1,q:"江戸時代に、話題の人物や風景などを筆や版画などで描いた絵画を何というか。",a:"浮世絵"},{v:1,q:"多色刷りの浮世絵を特に何と呼ぶか。",a:"錦絵"},{v:2,q:"「富岳三十六景」などの浮世絵を描いた人物。\n主に風景版画を残した。",a:"葛飾北斎"},{v:0,q:"「東海道五十三次」などの浮世絵を描いた人物。\n主に風景版画と風刺版画を残した。",a:"安藤広重"},{v:0,q:"俳諧で約二万もの句を作った俳人。\n庶民的な句が多い。",a:"小林一茶"},{v:2,q:"「東海道中膝栗毛（とうかいどうちゅうひざくりげ）」を書いた人物。庶民に人気があった。",a:"十返舎一九"},{v:2,q:"清教徒革命の後に、1688年にイギリスで起きた革命。\nオランダから新しい国王を招き、権利の章典が制定された。",a:"名誉革命"},{v:2,q:"1688年にイギリスで起きた名誉革命のときに制定されたきまり。",a:"権利の章典 (権利章典)"},{v:2,q:"1789年にフランスで起こった革命。\n財政の悪化や身分制度が原因。",a:"フランス革命"},{v:2,q:"フランス革命で行われた、自由と平等の宣言。\n「人は生まれながらにして自由かつ平等の権利を有する」",a:"人権宣言"},{v:0,q:"フランス革命のあとのフランスで皇帝となった軍人。",a:"ナポレオン"},{v:5,q:"イギリスではじまった蒸気機関による大きな技術革新。初めて鉄道や蒸気船をつくられ、機械による生産も始まった。",a:"産業革命"},{v:2,q:"産業革命がすすみ、資本家が労働者を雇い、利益の拡大をめざして活動を行うようになったが、その仕組みは？",a:"資本主義"},{v:2,q:"イギリスの産業革命の原因になったのは何の発達？",a:"蒸気機関"},{v:4,q:"テストによく出る、江戸時代の３つの改革と田沼意次の政治の語呂合わせは？",a:"よしきたまっかなみずでっぽう"},{v:4,q:"江戸時代の３つの改革を行った人物と、田沼意次の政治を時代順に並べなさい。",a:"➀吉宗②田沼③松平④水野"},{v:4,q:"江戸時代の３つの改革と、田沼意次の政治を時代順に並べなさい。",a:"➀享保②田沼③寛政④天保"}],
    15: [{v:1,q:"町人や百姓が学習した場所。読み書きやそろばんが教えられた。（今でいうと学習塾のようなもの）",a:"寺子屋"},{v:0,q:"藩校.藩がつくった学校.武士の人材育成が行われた.\n（今で言うと県立学校のようなもの）",a:"藩校"},{v:1,q:"天保のききんへの対応に不満を持ち、大阪で乱を起こした人物.元役人の反乱に、幕府は強い衝撃を受けた。",a:"大塩平八郎"},{v:0,q:"天皇を尊敬し、外国人を追い払おうという考え.天皇中心にするため、幕府を倒そうという運動につながった。",a:"尊王攘夷"},{v:0,q:"鹿児島県にあった開国派の藩.\n大久保利通や西郷隆盛などの有力者がいた。",a:"薩摩藩"},{v:1,q:"山口県にあった尊皇攘夷派の藩.\n伊藤博文、木戸孝允、高杉晋作などの有力者がいた。",a:"長州藩"},{v:2,q:"老中の水野忠邦が試みて失敗した改革.株仲間の解散,農民を強制的に村に帰らせたりした。",a:"天保の改革"},{v:10,q:"天保の改革を行った人物.株仲間の解散!!!などを行う.アヘン戦争で清が負けるのを見て異国船打ち払い令をゆるめた。",a:"★水野忠邦"},{v:0,q:"イギリスを中心とする三角貿易\nと、その結果起こったことを\n説明しなさい。",a:"イギリスは➀清に払った銀をとりかえしたい ➁インドに命令して清にアヘンを売らせる ③銀は清➡インド➡イギリスへ ④怒った清はアヘン戦争を始めた"},{v:2,q:"1840年に起きたイギリスと清の戦争.\nイギリスとの貿易で、アヘン中毒患者が激増したため。",a:"アヘン戦争"},{v:1,q:"1840年のアヘン戦争で敗れた清が結んだ不利な条約.清はイギリスとの貿易を認め、香港を奪われた。",a:"南京条約"},{v:4,q:"アヘン戦争で清が負けるのを見て、日本ではだれが何を行った？",a:"水野忠邦が、異国船打ち払い令をゆるめ、水や燃料を与えた。"},{v:2,q:"臨時に老中の上に置かれた最高職.将軍の補佐役.井伊直弼がこの役職についた。",a:"大老"},{v:0,q:"➀大老の井伊直弼による尊皇攘夷派の運動家のとりしまり.吉田松陰らが処刑.➁井伊直弼が暗殺された事件。",a:"➀安政の大獄\n➁桜田門外の変"},{v:2,q:"1853年、神奈川県の浦賀!!に来航し、開国を求めたアメリカ人は？",a:"ペリー"},{v:2,q:"1854年、再び来航したペリーと幕府が結んだ条約.静岡県の下田と北海道の函館を開港し、鎖国は終わった.!!",a:"日米和親条約"},{v:2,q:"1858年にアメリカとの貿易のため結ばれた、日本に不利な条約.領事裁判権を認め、関税自主権が無かった。",a:"日米修好通商条約"},{v:1,q:"日米和親条約と日米修好通商条約で開港した場所の語呂合わせは「ゲタバコのヨコにハナ」だが、それぞれの名前を答えなさい。",a:"下田函館 と 横浜神戸新潟函館長崎"},{v:0,q:"土佐藩の下級武士出身の浪士.勝海舟の弟子になり、海軍の勉強をし、貿易会社を設立。",a:"坂本龍馬"},{v:0,q:"薩摩藩と長州藩の同盟.対立していたが、坂本龍馬が結びつけた。",a:"薩長同盟"},{v:4,q:"幕府から朝廷へ政権を返した!!こと.1867年、15代将軍徳川慶喜!によって行われた。",a:"大政奉還"},{v:2,q:"幕府から朝廷に政権が返ったため、天皇中心の政権復活を発表した.岩倉具視,西郷隆盛,木戸孝允が中心。",a:"王政復古の大号令"},{v:2,q:"薩摩藩出身の政治家.勝海舟と協力し,戦争なしに江戸城を開城させた.征韓論にやぶれ、西南戦争で亡くなった。",a:"西郷隆盛"},{v:1,q:"長州藩出身の政治家.薩長同盟にかかわった.のちに、同じく長州藩の伊藤博文とともに岩倉使節団として欧米を回った。",a:"木戸孝允"},{v:1,q:"新政府と旧幕府軍の戦争.薩摩藩と長州藩を中心とした新政府が、会津藩を中心とした旧幕府軍に勝利した。",a:"戊辰戦争"},{v:4,q:"1861年～1865年、アメリカで起こった内戦.南部は奴隷制に賛成で、北部は奴隷制に反対だった。",a:"南北戦争"},{v:1,q:"南北戦争で北軍を率いたアメリカ大統領.奴隷解放宣言をし、勝利した.「人民の人民による人民のための政治」",a:"リンカン"},{v:0,q:"軍隊を強くする鉄血政策を進めた首相.フランスとの戦争に勝利し、ドイツ帝国を成立した。",a:"ビスマルク"},{v:0,q:"資本家が労働者を雇って経済を発展させるという考え.資本家と労働者の対立が増えた。",a:"資本主義"},{v:0,q:"労働者を中心とした平等な社会を目指すという考え.工場や土地を国有化し共有する。",a:"社会主義"},{v:3,q:"テストによく出て、みんなが間違いやすい江戸時代の２つの文化とその場所を説明してください。",a:"❶上方（京都大阪）は元禄文化  ❷江戸は化政文化"},{v:2,q:"商人が原材料や道具を農民に貸し，農民がそれぞれの家で作った製品を買い取る仕組み!をなんというか。",a:"問屋制家内工業"},{v:3,q:"商人などが作業場をつくって人を集め、分業で生産を行う仕組み!を何というか。",a:"工場制手工業"},{v:11,q:"がんばれ!みんな!\n次の内容は➀享保 ②田沼 ③寛政 ④天保のどれか？\nア 株仲間の解散 　イ 目安箱の設置 　ウ 朱子学以外を禁じた 　エ 新田開発の奨励（２人いる） 　オ 長崎貿易の奨励 　カ 公事方御定書 　キ 株仲間の奨励 　ク 旗本・御家人の借金を帳消し 　ケ 上げ米の制 　コ 農民を強制的に村に帰らせた 　サ 飢えに備えて、米を蓄えさせた 　シ 商業を重視した 　ス アヘン戦争を見て異国船打ち払い令をゆるめた 　セ 農民に村に帰ることを奨励",a:"ムズいがよく出る!\n➀享保　イ エ カ ケ\n②田沼　エ オ キ シ\n③寛政　ウ ク セ サ\n④天保　ア コ ス"}],
    16: [{v:3,q:"1868年に、天皇が神に誓う形で出された宣誓書.\n年号を明治と改めた.「広ク会議ヲオコシ」ではじまる。",a:"五箇条の御誓文"},{v:1,q:"明治時代に行われた政治の大幅な改革。（廃藩置県・地租改正・徴兵令などすべて合わせて）",a:"明治維新"},{v:1,q:"藩が土地や人民を朝廷へ返すこと.藩主は代わりに知事に任命された。",a:"版籍奉還"},{v:1,q:"1871年に、藩をなくして県を置いたこと.蝦夷地は北海道、琉球王国は後に沖縄県になった。",a:"廃藩置県"},{v:0,q:"政府の要職が、特定の藩の出身者で占められた政治.薩摩藩、長州藩、土佐藩、肥前藩で占められた。",a:"藩閥政治"},{v:5,q:"欧米の政治を学ぶため派遣された使節団.岩倉具視!（公家）、木戸孝允!（長州）伊藤博文（長州）大久保利通（薩摩）。",a:"岩倉使節団"},{v:0,q:"古い身分制度を改め、全ての身分を平等とした制度.公家や大名は華族、武士は士族、百姓や町民は平民。",a:"四民平等"},{v:1,q:"北海道の警備や開拓をする兵士.  \n四民平等で生活が苦しくなった士族がなった。",a:"屯田兵"},{v:1,q:"土佐藩出身の政治家.戊辰戦争で手柄を立て、明治政府で参議になった。",a:"板垣退助"},{v:0,q:"武力で朝鮮と国交を結ぼうという主張.板垣退助や西郷隆盛が提案したが反対され、政府を去った。",a:"征韓論"},{v:2,q:"近代的な産業を育てる政策.電信の開通、郵便制度の開始、鉄道の開通など。",a:"殖産 興業"},{v:3,q:"政府経営の官営模範工場.群馬県に建てられ、外国人が技術指導をした.世界遺産にも指定された。",a:"富岡製糸場"},{v:0,q:"1871年、日本と清が結んだ対等な条約.互いに領事裁判権(本国で裁判を受ける権利)を認めた。",a:"日清修好条規"},{v:4,q:"明治時代の欧米文化の広がり.まげの散髪、洋服の着用、太陽暦の導入など。",a:"文明開化"},{v:1,q:"群馬県の富岡製糸場や、福岡県の八幡製鉄所などのように、政府が建設した代表的なものは？",a:"官営模範工場"},{v:0,q:"フランスの思想家.「社会契約論」で人民主権を主張した。",a:"ルソー"},{v:0,q:"フランスの思想家.「法の精神」で三権分立を主張した。",a:"モンテスキュー"},{v:1,q:"「学問のすすめ」で人の平等を説いた思想家。",a:"福澤諭吉"},{v:3,q:"国を豊かにし、強い軍隊をもつという政策.明治政府の方針。",a:"富国強兵"},{v:5,q:"6歳以上の男女全ての子供の教育を義務づける制度.1872年に発布された。",a:"学制"},{v:2,q:"満20歳になった男子に兵役を義務づける制度.1873年に発布された。",a:"徴兵令"},{v:4,q:"1873年に行われた土地の調査.土地所有者に地価の3％を現金で納めさせた。",a:"地租改正"},{v:4,q:"地租改正により、土地の税金は❶だれに❷どのくらい❸何でおさめさせるようになったか。",a:"❶土地所有者に❷地価の3％を❸現金で納めさせた。"},{v:4,q:"右のような土地の権利書をなんというか.何が記載されているか。",a:"❶地券　❷土地の所有者の名前・土地の価格"},{v:2,q:"地租改正は何を目指して実施されたか。",a:"毎年、地価の３％を現金で納めさせることで、国の財政を安定させること。"},{v:0,q:"1875年、日本とロシアが結んだ条約.樺太をロシア領、千島列島を日本領とした。",a:"樺太･千島交換条約"},{v:1,q:"測量していた日本の軍艦が、朝鮮に砲撃された事件.朝鮮の都の近くで測量し刺激した。",a:"江華島事件"},{v:1,q:"江華島事件を口実に、朝鮮と結んだ条約.朝鮮にとって不平等な内容で、三つの港を開かせた。",a:"日朝修好条規"},{v:0,q:"国民によって議員が選ばれることを求めた意見書.板垣退助らが、1874年に提出した。",a:"民撰議院設立建白書"},{v:0,q:"国会開設を求める運動の中心となった政治団体.多くの署名を集めた。",a:"国会期成同盟"},{v:0,q:"板垣退助が結成した政党.フランスの人権思想に基づいた。",a:"自由党"},{v:2,q:"国民の政治への参加を目指し、国会開設や憲法制定を求めた運動のこと。板垣退助の自由党が中心となった。",a:"自由民権運動"},{v:0,q:"国会即時開設を主張し、政府を去った人物.立憲改進党を結成した。",a:"大隈重信"},{v:1,q:"西郷隆盛と特権を奪われた士族達が起こした反乱.鎮圧され、最後の士族反乱になった。",a:"西南戦争"},{v:5,q:"初代内閣総理大臣になった政治家.長州藩出身で岩倉使節団にも参加した。1885年、内閣制度が成立した。",a:"★伊藤博文"}],
    17: [{v:3,q:"君主権の強いドイツ !!! の憲法を参考にした近代的な憲法。\n主権は天皇にあり、国民は天皇の臣民とされた。",a:"大日本帝国憲法"},{v:0,q:"大日本帝国憲法が公布された年号。\n覚え方･･･[いち早く] 近代的な憲法を導入。",a:"1889年"},{v:1,q:"天皇への忠義と愛国を基本とした教育方針。",a:"教育 勅語"},{v:0,q:"貴族院と衆議院の二院制で開かれた国会。貴族院は皇族や華族で構成され、衆議院は有権者が選んだ。",a:"帝国議会"},{v:4,q:"帝国議会の選挙に投票できるのは、どのような人々でしたか。",a:"直接国税を１５円以上納めた２５歳以上の男子"},{v:2,q:"欧米（ヨーロッパ・アメリカ）や日本などが、軍事力を強めて植民地支配を行う政策。",a:"帝国主義"},{v:2,q:"朝鮮で農農民が起こした戦争。\n援軍として清が出兵し、日本も対抗して出兵した。",a:"甲午農民戦争"},{v:3,q:"甲午農民戦争を機に、1894年日本と清の間で起こった戦争.　日本が圧勝し、下関条約を結んだ。",a:"日清戦争"},{v:5,q:"➀1895年、日清戦争に勝利した日本が清と結んだ条約と➁その場所は？  日本は遼東半島や多額の賠償金を得た。",a:"❶下関 条約❷山口県"},{v:1,q:"ロシア、ドイツ、フランスによる遼東半島の返還要求.\n日本は遼東半島を返還し、ロシアに反感をもった。",a:"三国干渉"},{v:3,q:"日本が下関条約で清から得たが、のちに三国干渉によって返還することになった地域は？",a:"遼東半島"},{v:8,q:"日清戦争の賠償金で建設された!!!官営の製鉄所.\n福岡県に建設され、日本の近代化に貢献した。",a:"八幡製鉄所"},{v:5,q:"伊藤博文内閣の外務大臣.イギリスをはじめとした欧米諸国との治外法権（領事裁判権）を撤廃することに成功。",a:"陸奥宗光"},{v:4,q:"「たけくらべ」などを書いた小説家.\n思春期の恋愛などをテーマにした。",a:"樋口一葉"},{v:0,q:"「坊ちゃん」や「吾輩は猫である」などを書いた小説家.\n滑稽な人物描写で分かりやすい作品を書いた。",a:"夏目漱石"},{v:0,q:"三行書きの短歌集「一握の砂」などを書いた詩人.\n近代社会の人々の姿を表現した。",a:"石川啄木"},{v:1,q:"日本で最初の公害問題である足尾銅山鉱毒事件で\n天皇に直訴した政治家。",a:"田中正造"},{v:2,q:"1902年に、日本とイギリスが結んだ同盟.\nロシアのアジア侵略を阻止するため、利害が一致した。",a:"日英同盟"},{v:2,q:"1904年に起こった、日本とロシアの戦争.\n満洲や韓国をめぐって対立した。",a:"日露戦争"},{v:5,q:"日露戦争のあと、1905年、アメリカの仲介で結ばれた日本とロシアの条約。",a:"ポーツマス条約"},{v:5,q:"ポーツマス条約への不満から起こった暴動.戦死者が多かったのに、賠償金がなかったため暴動が起きた。",a:"日比谷焼き打ち事件"},{v:1,q:"桂太郎内閣の外務大臣.\n関税自主権を完全に回復することに成功した。",a:"小村寿太郎"},{v:1,q:"1910年に始まった、日本による韓国の植民地化.\n韓国の学校では、日本語や日本の歴史が教えられた。",a:"韓国併合"},{v:0,q:"天皇暗殺を企てた容疑で、社会主義者が検挙された事件.\n数千人が検挙され、12名が処刑された。",a:"大逆事件"},{v:1,q:"明治政府に弾圧され、大逆事件で処刑された人物.\n社会主義政党の結成や日露戦争の反対をした。",a:"幸徳秋水"},{v:1,q:"「みだれ髪」などの歌集を出版した歌人.\n日露戦争に従軍した弟を心配した詩が有名。",a:"与謝野晶子"},{v:2,q:"血清学や免疫学で注目された医学者.\n黄熱病の研究中に感染して死亡した。",a:"野口英世"},{v:1,q:"中国の義和団が、外国公使館を取り囲んだ事件.\n反キリスト教、反外国を主張したが、鎮圧された。",a:"義和団事件"},{v:1,q:"中国同盟会を結成し、三民主義を唱えた人物.\n三民主義とは、「民族独立」「民主制」「民衆の生活安定」。",a:"孫文"},{v:2,q:"清からの独立を求めた革命.\n孫文が臨時大統領となり、中華民国が成立した。",a:"辛亥革命"},{v:1,q:"次のできごとのきっかけとなったものをそれぞれあげなさい。➀日朝修好条規　②日清戦争",a:"➀江華島事件　\n②甲午農民戦争"},{v:3,q:"明治時代におこなわれた不平等条約の改正について、それにかかわった２人の人物とそれぞれ何を行ったか、答えなさい。",a:"➀陸奥宗光\n（領事裁判権の撤廃）\n②小村寿太郎\n（関税自主権の回復）"}],
    18: [{v:2,q:"ドイツ、オーストリア、イタリアの同盟。\nドイツとオーストリアは同じゲルマン民族(ドイツ人)。",a:"三国同盟"},{v:0,q:"イギリス、フランス、ロシアの同盟。\n三国同盟と対立していた。",a:"三国協商"},{v:3,q:"「ヨーロッパの火薬庫」と呼ばれた半島.\nサラエボ事件から第一次世界大戦が始まった。",a:"バルカン半島"},{v:3,q:"セルビア人がオーストリアの皇太子夫妻を暗殺した事件.\nこの事件を機に、オーストリアはセルビアに宣戦した。",a:"サラエボ事件"},{v:2,q:"1914年、サラエボ事件を機に始まった世界規模の戦争.\n三国同盟と三国協商の対立を巻き込んだ。",a:"第一次世界大戦"},{v:0,q:"第一次世界大戦で三国協商側に味方した国々.\n日本は日英同盟を理由に三国協商側に味方した。",a:"連合国"},{v:3,q:"第一次世界大戦中にドイツに宣戦した日本が、中国に出した要求。中国領土内のドイツの権利を日本に譲るなど。",a:"二十一か条の要求"},{v:0,q:"中立だったが、1917年にドイツに宣戦した国.\nこれにより、ドイツ側は休戦に同意し、終戦した。",a:"アメリカ"},{v:2,q:"第一次世界大戦の後処理のために、1919年にパリで開かれた会議。国際組織の設立と独立を目指した。",a:"パリ講和会議"},{v:5,q:"1919年、連合国側とドイツが結んだ講和条約.\nドイツは植民地を失い、多額の賠償金を要求された。",a:"ベルサイユ条約"},{v:0,q:"1919年に韓国で起こった、日本からの独立を求める運動.\n朝鮮人が「独立万歳」と叫んだ。",a:"三・一独立運動"},{v:0,q:"1919年に中国で起こった、ベルサイユ条約への反対運動.\n日本に二十一か条の要求取り消しを求めた。",a:"五・四運動"},{v:1,q:"1920年に設立された、平和を目的とする国際組織.\n常任理事国は、イギリス、フランス、イタリア、日本。",a:"国際連盟"},{v:1,q:"国際連盟の設立を最初に提唱した➀大統領の名前と、➁国民の反対で国際連盟に加盟できなかった国名は？",a:"➀ウィルソン　➁アメリカ"},{v:2,q:"1921-22年にアメリカで開かれた軍備縮小のための会議。日英同盟解消、海軍軍縮。",a:"ワシントン会議\n(ワシントン海軍軍縮条約）"},{v:3,q:"第一次世界大戦中に、1917年の二月と十月に、ロシアで起こった革命。皇帝を退け、社会主義を求めた。",a:"ロシア革命"},{v:1,q:"ロシア革命の指導者.\n臨時政府を倒し、ソビエト連邦を樹立した。",a:"レーニン"},{v:4,q:"ロシア革命後に、ロシアの革命政府を倒す目的の出兵.\nイギリス、アメリカ、フランス、日本が出兵した。",a:"シベリア出兵"},{v:0,q:"1917年のロシア革命のあと、設立された国。",a:"ソ連"},{v:1,q:"インドで起こった、イギリスからの独立運動の指導者.\n非暴力、不服従の姿勢だった。",a:"ガンディー"},{v:5,q:"大正時代に、社会運動によって進んだ民主化.\n労働争議や小作争議などの社会運動が頻繁に起こった。",a:"大正デモクラシー"},{v:1,q:"民本主義をとなえ、青年らに影響を与えた人物.\n憲法のもとでの民主主義のあり方を説いた。",a:"吉野作造"},{v:3,q:"吉野作造が主張した考え方.\n大日本帝国憲法のもとでの民主主義のあり方を説いた。",a:"民本主義"},{v:1,q:"社会主義思想と結びつく文学.\n小林多喜二の「蟹工船」で、過酷な労働状況が描かれた。",a:"プロレタリア文学"},{v:3,q:"女性差別解消を求める運動を起こした女性.\n1911年に青鞜社、1920年に新婦人協会を設立した。",a:"平塚らいちょう\n(平塚らいてう)"},{v:2,q:"立憲改進党に所属していた、護憲運動の中心人物。五・一五事件で暗殺された。",a:"★犬養毅"},{v:6,q:"富山県の主婦達から全国に広がった米の値下げ要求.\nシベリア出兵をみこして、商人が米を買い占めたため!!!。",a:"米騒動"},{v:3,q:"米騒動が起こった原因は？",a:"シベリア出兵をみこして、商人が米を買い占めたため。"},{v:3,q:"閣僚の大半が政党に所属している内閣.\n議会で多数を占める政党から、首相が選ばれた。",a:"政党内閣"},{v:3,q:"日本で最初の本格的な政党内閣の総理大臣。",a:"★原敬"},{v:4,q:"1922年に、差別問題の解決を目指して創立された組織.\n法的に四民平等になっても、差別が残っていたため。",a:"全国水平社"},{v:4,q:"25歳以上の全ての男子に選挙権を認める法律.税金の金額に関係なく選挙権が与えられた。",a:"普通選挙法"},{v:1,q:"普通選挙と治安維持法が始まった年号.加藤高明内閣.\n覚え方･･･選挙に[行く25]歳以上男子。",a:"1925年"},{v:6,q:"社会主義運動を取り締まるための法律。社会主義運動を弾圧した.普通選挙法と同じ1925年につくられた。",a:"治安維持法"},{v:0,q:"1923年に関東で起こった震災.\n混乱の中で虐殺事件なども起こった。",a:"関東大震災"}],
    19: [{v:2,q:"アメリカの不景気が世界に広がって起こった不況.\n株価が暴落し、不景気になった。",a:"世界恐慌"},{v:8,q:"世界恐慌に対するアメリカの経済対策.ダム建設などの公共事業で、政府が積極的に経済を調整した。",a:"ニューディール政策"},{v:1,q:"ニューディール政策を行った大統領.\n失業者の吸収や、農業生産の調整などを行った。",a:"ルーズベルト"},{v:5,q:"世界恐慌に対する英仏の経済対策.植民地との貿易を優先し、他国の商品に高い関税をかけた.!!",a:"ブロック経済"},{v:0,q:"大きい資本や企業を支配する一族のグループ.三菱、三井、住友、安田など.政治的発言力を強めた。",a:"財閥"},{v:0,q:"イギリス首相の提案で開かれた、戦艦などを減らすための会議.日本の海軍は反対した。",a:"ロンドン海軍軍縮会議"},{v:0,q:"日露戦争後に、ロシアから委譲された鉄道会社.\n日本の中国侵略の拠点となった。",a:"満州鉄道"},{v:0,q:"満洲事変のきっかけとなったできごと.\n日本軍が南満州鉄道の線路を爆破した。",a:"柳条湖事件"},{v:1,q:"関東軍が満州を占拠した事件.\n満州鉄道の爆破を中国軍のしわざにして攻撃した。",a:"満州事変"},{v:1,q:"清の皇帝を元首として満州に建国された国.\n日本が実権を握り、農民32万人を移住させた。",a:"満州国"},{v:7,q:"満州国に反対した犬養毅首相を、海軍の青年将校らが暗殺した事件.軍人中心の政治になった!!。",a:"五・一五事件"},{v:2,q:"満州国設立に反対したため、海軍の青年将校によって、五・一五事件で暗殺された首相。",a:"★犬養毅"},{v:1,q:"満州を調査するために、国際連盟が送った調査団.\n国際連盟は満州国を認めなかった。",a:"リットン調査団"},{v:2,q:"リットン調査団の調査により日本軍の満州国撤退を要求されたため、日本がとった行動。",a:"国際連盟脱退"},{v:2,q:"ドイツやイタリアで行われた軍国主義的な独裁政治.\n個人の自由より国家の団結を重視。",a:"ファシズム"},{v:0,q:"ドイツで結成され、ヒトラーによる軍事独裁を行った政党の略称。",a:"ナチス"},{v:2,q:"ドイツのナチスの総統.世界恐慌の後、失業者を減らす一方で、独裁体制を確立した。",a:"ヒトラー"},{v:0,q:"ナチスが迫害した人種.\nナチスはドイツ民族のほうが優れていると主張した。",a:"ユダヤ人"},{v:3,q:"ソ連の独裁政治家.\nレーニンの死後、指導権を確立し、反対派を処刑した。",a:"スターリン"},{v:7,q:"スターリンが進めた経済対策.社会主義だったソ連は、世界恐慌の影響をうけず工業化した!!!!!。",a:"五か年計画"},{v:0,q:"1936年、陸軍の青年将校らが首相官邸を占拠した事件.\n軍の発言権が強まり、軍事費が増えた。",a:"二・二六事件"},{v:2,q:"北京郊外で日本軍と中国軍が衝突した事件で、日中戦争のきっかけになった。",a:"盧溝橋 事件"},{v:1,q:"盧溝橋事件を機に始まった日本と中国の戦争.\n日本軍は各地を占領したが、戦争は長期化した。",a:"日中戦争"},{v:1,q:"孫文の後継者として中国国民党の党首になった人物.\n中国共産党と対立していた。",a:"蒋介石"},{v:1,q:"中国共産党を創立し、党首になった人物.のちに中華人民共和国をつくった。",a:"毛沢東"},{v:2,q:"❶五・一五事件と❷二・二六事件それぞれの政治への影響を述べなさい。",a:"❶政党政治が終わり、軍人中心の政治になった。\n❷軍の発言権が強まり、軍事費が増えた。"},{v:2,q:"次のできごとのきっかけとなったものをそれぞれあげなさい。➀満州事変　②日中戦争",a:"➀柳条湖事件\n②盧溝橋事件"},{v:6,q:"国民や物資を戦争優先にする法律.\n国民を強制的に工場で働かせることも可能になった。",a:"国家総動員法"},{v:1,q:"1939年9月、ドイツのポーランド侵略を機に始まった戦争.イギリスとフランスが宣戦した。",a:"第二次世界大戦"},{v:2,q:"1940年9月、日本、ドイツ、イタリアが結んだ同盟.\n輸出を制限するアメリカをけん制するため。",a:"日毒伊三国同盟"},{v:1,q:"日本・ドイツ・イタリアと敵対した、ABCD包囲網とはどこの国？",a:"アメリカ・イギリス・中国・オランダ"},{v:2,q:"挙国一致で戦争に臨むために、政党を解散して作られた組織。",a:"大政翼賛会"},{v:2,q:"1941年4月、安全確保のため、日本がソ連と結んだ条約.\n日本は東南アジアを侵略した。",a:"日ソ中立条約"},{v:0,q:"真珠湾攻撃を機に始まった戦争.\n日本は、先制攻撃で南太平洋を占領した。",a:"太平洋戦争"},{v:0,q:"第二次世界大戦で、日本、ドイツ、イタリアと戦った国.アメリカ、ソ連、中国など。",a:"連合国"},{v:0,q:"第二次世界大戦で、連合国と戦った国.\n日本、ドイツ、イタリア。",a:"枢軸国"},{v:0,q:"徴兵が免除されていた文科系の学生を戦場へ送る制度.\n国民学校で軍事教育が強化された。",a:"学徒出陣"},{v:1,q:"1945年2月、アメリカ、イギリス、ソ連が行った会談.\nドイツの戦後処理と対日参戦について討議した。",a:"ヤルタ会談"},{v:1,q:"アメリカ軍が上陸した日本の本土.\n16万人以上が犠牲になった。",a:"沖縄"},{v:1,q:"1945年5月に降伏した日本の同盟国.\nヒトラーは降伏前に自害した。",a:"ドイツ"},{v:3,q:"1945年7月、連合国側が日本に無条件降伏を求めた宣言.原子爆弾の投下後に受け入れた。",a:"ポツダム宣言"},{v:0,q:"1945年8月、アメリカが日本に投下した大量破壊兵器.\nソ連が参戦する前に降伏させようとした。",a:"原子爆弾"},{v:2,q:"1945年8月6日に原子爆弾が投下された都市.\n現在も原爆ドームが残っている。",a:"広島"},{v:1,q:"1945年8月9日に原子爆弾が投下された都市.\n7万人以上の命が奪われた。",a:"長崎"},{v:0,q:"第二次世界大戦が終戦した日付.\n日本は、190万人以上の死者を出した。",a:"1945年8月15日"}],
    20: [{v:2,q:"1945年に成立した、戦争を防ぐための国際組織.\nチャーチルとルーズベルトが発表した。",a:"国際連合(国連)"},{v:4,q:"日本を占領した連合国の組織.\n軍国主義の排除と民主主義の育成に重点をおいた。",a:"GHQ\n(連合国最高司令官総司令部)"},{v:2,q:"連合国総司令部(GHQ)の最高司令官.\n日本政府に対し、指示や命令を行った。",a:"マッカーサー"},{v:0,q:"太平洋戦争の戦犯を裁いた裁判.\n東条英機らが逮捕され処罰された。",a:"東京 裁判"},{v:6,q:"政府が地主から土地を買い上げて、小作人に安く売った政策.自作農が大幅に増えた.!!",a:"農地改革"},{v:2,q:"日本の産業や経済を独占してきた財閥を解散させた.三菱・三井などの財閥が無くなった。",a:"財閥解体"},{v:7,q:"1946年、満20歳以上の男女に選挙権が認められた選挙.女性の国会議員が誕生!!!",a:"普通選挙"},{v:4,q:"1946年に公布された憲法.\n国民主権、平和主義、基本的人権の尊重を原則とした。",a:"日本国憲法"},{v:7,q:"1951年に吉田茂がアメリカなど４８か国と結んだ講和条約.日本は占領から独立した。",a:"サンフランシスコ平和条約"},{v:4,q:"1951年にサンフランシスコ平和条約を結んだ総理大臣。",a:"吉田　茂"},{v:3,q:"日本にアメリカ軍や軍事基地を置くことを認める条約.\n1951年に結ばれた。",a:"日米安全保障条約"},{v:4,q:"アメリカを中心とする資本主義国と、ソ連の社会主義国との、戦火を交えない対立や競争。",a:"冷戦"},{v:3,q:"1950年～1953年韓国と北朝鮮の間で起こった戦争.アメリカとソ連による冷戦のために起きた。",a:"朝鮮戦争"},{v:4,q:"朝鮮戦争に際し、アメリカ軍が軍需物資の調達を行ったことによる好景気は？ これで経済は回復した。",a:"特需景気"},{v:5,q:"1947年に、教育の機会均等、男女共学、義務教育などを定め、制定された法律。",a:"教育基本法"},{v:4,q:"1956年、日本が調印したソ連との国交回復宣言.\n同じ年、日本は国際連合に加盟した。",a:"日ソ共同宣言"},{v:4,q:"日ソ共同宣言に調印したおかげで、そのあと、日本は何ができたか。",a:"国際連合に加盟"},{v:1,q:"1961年、冷戦の影響でドイツを東西に隔てた壁.\n西ドイツと、ソ連側の東ドイツに分断。",a:"ベルリンの壁"},{v:1,q:"1962年、ソ連がキューバに核ミサイルを持ち込んだ出来事.核戦争になる寸前だった。",a:"キューバ危機"},{v:5,q:"戦後の日本の急激な経済発展.新幹線が開通し、家庭電化製品が普及した.石油危機により終わった。",a:"高度経済成長"},{v:2,q:"1960年に池田勇人首相!!が出した「10年間で日本人の所得を２倍にする」という計画。",a:"所得倍増計画"},{v:2,q:"水俣病、四日市ぜんそく、イタイイタイ病などの問題.\n高度経済成長により、環境汚染が進んだ。",a:"公害問題"},{v:1,q:"環境汚染により発生した公害問題への対応として、1967年に国が制定した法律は？",a:"公害対策基本法"},{v:1,q:"1964年に東京で開催された国際的なスポーツイベント.\nアジアではじめて行われた。",a:"東京オリンピック"},{v:1,q:"1965年、日本と韓国が結んだ条約.\n韓国との国交が正常化された。",a:"日韓基本条約"},{v:1,q:"1965年～1976年、ベトナムで起こった戦争.戦争に介入したアメリカは撤退した。",a:"ベトナム戦争"},{v:0,q:"1972年にアメリカから沖縄が日本に返されたことをなんというか。",a:"沖縄返還"},{v:3,q:"非核三原則を正確に答えなさい。",a:"核兵器を　持たず　作らず　持ち込ませず"},{v:2,q:"1972年に行われた、日本と中国の国交正常化の発表.\nさらに1978年、日中平和友好条約が結ばれた。",a:"日中 共同 声明"},{v:1,q:"1972年に日中共同声明が発表され、その後の1978年に日本と中国の間で結ばれた条約は？",a:"日中 平和友好条約"},{v:2,q:"1973年、中東戦争の影響で起こった石油価格の上昇.\nこれにより高度経済成長が終わった。",a:"オイルショック（石油危機）"},{v:7,q:"➀日ソ共同宣言　②サンフランシスコ平和条約　③第二次世界大戦終戦　④日中平和友好条約　⑤国際連合加盟　⑥日中共同声明　⑦日韓基本条約　を順番に並び替えなさい。",a:"③②➀⑤⑦⑥④\n③第二次大戦の終戦 　②サンフランシスコ平和条約と日米安保条約 　➀日ソ共同宣言 ⑤国際連合加盟　 ⑦日韓基本条約　 ⑥日中共同声明 　④日中平和友好条約"},{v:6,q:"第二次世界大戦後の日本が仲なおりをした国を順番に言うと？",a:"終戦⇒アメリカ⇒ソ連⇒国連⇒韓国⇒中国"},{v:4,q:"アメリカとソ連の冷戦の歴史を並び替えなさい.\n➀ソ連なくなる　②朝鮮戦争　③ベルリンの壁なくなりドイツ統一　④マルタ会談　⑤ベトナム戦争　⑥キューバ危機　⑦ペレストロイカ",a:"②⑥⑤  ⑦④③①\n②朝鮮戦争　⑥キューバ危機　⑤ベトナム戦争 ⑦ペレストロイカ　④マルタ会談　③ベルリンの壁なくなりドイツ統一　①ソ連なくなる"}],
    21: [{v:0,q:"世界が一体化し、世界の結びつきが強くなること.\n交通機関やインターネットの発達など。",a:"グローバル化"},{v:1,q:"1980年代後半から続いていた好景気.\n株価や地価の暴落によって、不況になった。",a:"バブル経済"},{v:0,q:"冷戦により東西に分断されていたが、1990年に統一された国.ベルリンの壁が壊された。",a:"ドイツ"},{v:0,q:"1991年に解体された国.\nロシアを中心としたゆるやかな連合になった。",a:"ソ連"},{v:0,q:"国際平和の目的で自衛隊の海外派遣を認める法律.\n多国籍軍に参加出来ず非難を浴びたため。",a:"PKO法"},{v:0,q:"発展途上国の経済を援助する国際的な機関.\n出資額で日本は世界一になった。",a:"政府開発援助(ODA)"},{v:1,q:"1993年に発足したヨーロッパ諸国の集まり.\nECがより強く統合されたもの。",a:"欧州連合(EU)"},{v:1,q:"EU加盟国の共通通貨（お金）とは？",a:"ユーロ"},{v:0,q:"1995年に関西で起こった震災.\n6,000人以上の死者を出した。",a:"阪神・淡路大震災"},{v:0,q:"21世紀の経済発展が著しい5カ国の総称.\nブラジル、ロシア、インド、中国、南アフリカ。",a:"BRICs"},{v:0,q:"二酸化炭素の増加などによる、地球の平均気温の上昇.\n農作物への影響や海面上昇を引き起こす。",a:"地球温暖化"},{v:0,q:"地球温暖化を防ぐため、二酸化炭素を規定した議定書.\n1997年に発効された。",a:"京都議定書"},{v:1,q:"2015年に、すべての国・地域が温室効果ガスの排出削減の目標に取り組むとしたもの。",a:"パリ協定"},{v:0,q:"出生率が下がり、高齢者の割合が増える問題.\n年金などの社会保障が機能しなくなる原因。",a:"少子高齢化問題"},{v:0,q:"日本とロシアが領有権を主張している島.\n第二次世界大戦終了間際にソ連が占領した。",a:"北方領土"},{v:0,q:"2011年3月11日に起こった震災.\n大津波によって多数の死者を出した。",a:"東日本大震災"}]

// --- 以下、システムプログラム ---
const body = document.getElementById('menu-body');
Object.entries(categoryMap).forEach(([cat, ids]) => {
    ids.forEach((id, i) => {
        const tr = document.createElement('tr');
        if (i === 0) {
            const tdCat = document.createElement('td');
            tdCat.className = 'cat-cell'; tdCat.rowSpan = ids.length;
            tdCat.innerHTML = `<label onclick="event.stopPropagation();"><input type="checkbox" onclick="tc_cat('${cat}', this)"> ${cat}</label>`;
            tr.appendChild(tdCat);
        }
        const tdEra = document.createElement('td');
        tdEra.className = 'era-name-cell';
        tdEra.onclick = function() { const ck = this.querySelector('input'); ck.checked = !ck.checked; tR(id, ck); };
        tdEra.innerHTML = `<input type="checkbox" class="c-${cat}" id="ec${id}" onclick="event.stopPropagation(); tR(${id}, this)"> ${eraNames[id]}`;
        tr.appendChild(tdEra);
        for(let lv=1; lv<=3; lv++){
            const tdLv = document.createElement('td');
            tdLv.innerHTML = `<input type="checkbox" class="tc L${lv} e-${id}" id="c${id}L${lv}">`;
            tr.appendChild(tdLv);
        }
        tr.dataset.id = id; body.appendChild(tr);
    });
});

function tc_cat(cat, e) { document.querySelectorAll('.c-'+cat).forEach(ck => { ck.checked = e.checked; tR(ck.id.replace('ec',''), ck); }); }
function tR(id, e) {
    document.getElementById('c'+id+'L1').checked = e.checked;
    document.getElementById('c'+id+'L2').checked = e.checked;
    if(!e.checked) document.getElementById('c'+id+'L3').checked = false;
}
function tl_col(lv) {
    const boxes = document.querySelectorAll('.L'+lv);
    const isAnyUnchecked = Array.from(boxes).some(b => !b.checked);
    boxes.forEach(b => b.checked = isAnyUnchecked);
}
function tl_all_set(v) {
    document.querySelectorAll('input[type="checkbox"]').forEach(b => { if(!b.name) b.checked = v; });
}

function go() {
    const countSelect = document.querySelector('input[name="qCount"]:checked');
    const count = parseInt(countSelect.value);
    let pool = [];
    let selectedEraIds = new Set();
    
    body.querySelectorAll('tr').forEach(row => {
        const id = parseInt(row.dataset.id);
        const items = rawData[id] || [];
        const l1 = document.getElementById('c'+id+'L1').checked;
        const l2 = document.getElementById('c'+id+'L2').checked;
        const l3 = document.getElementById('c'+id+'L3').checked;
        
        let sub = [];
        if (l1) sub = sub.concat(items.filter(m => m.v >= 3));
        if (l2) sub = sub.concat(items.filter(m => (m.v == 1 || m.v == 2)));
        if (l3) sub = sub.concat(items.filter(m => m.v == 0));
        
        if(sub.length > 0) selectedEraIds.add(id);
        Array.from(new Set(sub)).forEach(m => pool.push({...m, id: id}));
    });

    if (pool.length === 0) { alert('項目を選択してください'); return; }
    const unique = []; const s = new Set();
    pool.forEach(x => { if(!s.has(x.q)){ unique.push(x); s.add(x.q); } });
    const finalCount = Math.min(unique.length, count);
    unique.sort(() => Math.random() - 0.5);
    const selected = unique.slice(0, finalCount);
    
    // ヘッダー情報
    const rangeText = Array.from(selectedEraIds).map(id => eraShortNames[id]).filter((v, i, a) => a.indexOf(v) === i).join('、');
    document.getElementById('print-range').innerText = "範囲：" + rangeText;
    document.getElementById('q-total-disp').innerText = finalCount;

    let qh=''; let ah='';
    selected.forEach((x, i) => {
        qh += `<div class="q-row"><div class="q-text">${i+1}. ${x.q.replace(/\n/g,'<br>')}</div></div>`;
        ah += `<div class="ans-item">${i+1}:${x.a}<small>(${eraShortNames[x.id]})</small></div>`;
    });
    
    document.getElementById('qs').innerHTML = qh;
    document.getElementById('as').innerHTML = ah;
    const out = document.getElementById('out');
    out.className = 'mode-' + count;
    out.style.display = 'flex';
    window.print();
}
</script>
